; PlatformIO Project Configuration File
;
; ╔══════════════════════════════════════════════════════════════╗
; ║     M5Stack Cardputer — BLE MIDI Keyboard                    ║
; ║     с поддержкой матричной клавиатуры (74HC595 + 74HC165)    ║
; ║     РЕФАКТОРИНГ: Модульная архитектура                       ║
; ╚══════════════════════════════════════════════════════════════╝

[env:m5stack-cardputer]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; ── Serial Monitor ──────────────────────────────────────────────────────────
monitor_speed = 115200
monitor_rts   = 0
monitor_dtr   = 0
monitor_filters = esp32_exception_decoder

; ── Build flags ──────────────────────────────────────────────────────────────
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    -DCONFIG_BT_NIMBLE_TASK_STACK_SIZE=5120

; ── Разделы флеша ───────────────────────────────────────────────────────────
board_build.partitions = huge_app.csv

; ── Библиотеки ──────────────────────────────────────────────────────────────
lib_deps =
    m5stack/M5Cardputer
    m5stack/M5Unified
    lathoub/BLE-MIDI

lib_ldf_mode = deep+

; ── Upload ──────────────────────────────────────────────────────────────────
upload_speed = 1500000

; ══════════════════════════════════════════════════════════════════════════════
;  СТРУКТУРА ПРОЕКТА ПОСЛЕ РЕФАКТОРИНГА:
; ══════════════════════════════════════════════════════════════════════════════
;
;  src/
;  ├── main.cpp                    - ГЛАВНЫЙ ФАЙЛ (setup + loop)
;  │
;  ├── config.h                    - Все константы и конфигурация
;  ├── types.h                     - Типы данных и перечисления
;  │
;  ├── app_state.h/cpp             - Глобальное состояние приложения
;  │
;  ├── matrix_keyboard.h/cpp       - Работа с матричной клавиатурой
;  ├── keyboard_map.h              - Маппинг встроенной клавиатуры
;  ├── midi_helpers.h/cpp          - Вспомогательные функции MIDI
;  │
;  ├── ble_midi_handler.h/cpp      - Работа с BLE MIDI
;  │
;  ├── display.h/cpp               - Рисование пользовательского интерфейса
;  ├── menu_logic.h/cpp            - Логика работы меню
;  ├── play_mode.h/cpp             - Логика режима игры
;
; ══════════════════════════════════════════════════════════════════════════════
;
;  ПРЕИМУЩЕСТВА МОДУЛЬНОЙ АРХИТЕКТУРЫ:
;  • Легче читать и понимать код
;  • Просто добавлять новые функции
;  • Можно редактировать отдельные модули без влияния на другие
;  • Логическое разделение ответственности
;  • Лучше поддерживается и тестируется
