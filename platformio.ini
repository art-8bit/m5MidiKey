; PlatformIO Project Configuration File
;
; ╔══════════════════════════════════════════════════════════════╗
; ║     M5Stack Cardputer — BLE MIDI Keyboard                    ║
; ║     с поддержкой матричной клавиатуры (74HC595 + 74HC165)    ║
; ║     PlatformIO config                                        ║
; ╚══════════════════════════════════════════════════════════════╝

[env:m5stack-cardputer]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; ── Serial Monitor ──────────────────────────────────────────────────────────
monitor_speed = 115200
monitor_rts   = 0
monitor_dtr   = 0
monitor_filters = esp32_exception_decoder

; ── Build flags ──────────────────────────────────────────────────────────────
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    -DCONFIG_BT_NIMBLE_TASK_STACK_SIZE=5120

; ── Разделы флеша ───────────────────────────────────────────────────────────
board_build.partitions = huge_app.csv

; ── Библиотеки ──────────────────────────────────────────────────────────────
lib_deps =
    m5stack/M5Cardputer
    m5stack/M5Unified
    lathoub/BLE-MIDI

lib_ldf_mode = deep+

; ── Upload ──────────────────────────────────────────────────────────────────
upload_speed = 1500000