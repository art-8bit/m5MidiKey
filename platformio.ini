; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
; ╔══════════════════════════════════════════════════════════════╗
; ║     M5Stack Cardputer — BLE MIDI Keyboard                    ║
; ║     PlatformIO config                                        ║
; ╚══════════════════════════════════════════════════════════════╝

[env:m5stack-cardputer]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino


; ── Serial Monitor (macOS: отключаем RTS/DTR, иначе ESP32 сбрасывается) ──
monitor_speed = 115200
monitor_rts   = 0
monitor_dtr   = 0
monitor_filters = esp32_exception_decoder

; ── Build flags ──────────────────────────────────────────────────────────
build_flags =
    ; Отключаем USB CDC при старте — нужно для стабильного Serial на macOS
    -DARDUINO_USB_CDC_ON_BOOT=0
    ; Подавляем шумные debug-логи IDF
    -DCORE_DEBUG_LEVEL=0
    ; Разрешаем PSRAM (если нужно для больших спрайтов)
    -DBOARD_HAS_PSRAM
    ; Фиксируем размер стека задачи BLE (опционально)
    -DCONFIG_BT_NIMBLE_TASK_STACK_SIZE=5120

; ── Разделы флеша: huge_app даёт ~3 МБ для кода + BLE стек ──────────────
board_build.partitions = huge_app.csv

; ── Библиотеки ────────────────────────────────────────────────────────────
lib_deps =
    m5stack/M5Cardputer
    m5stack/M5Unified
    lathoub/BLE-MIDI

; deep+ — рекурсивно ищет зависимости BLE-MIDI (нужен MIDI-lib и BLE core)
lib_ldf_mode = deep+

; ── Upload ────────────────────────────────────────────────────────────────
upload_speed = 1500000

